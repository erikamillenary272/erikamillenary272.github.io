<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="突然做的个人主页">
  <title>Loading...</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
</head>
<body>

  <main id="top">

    <!-- ======== 头部：玻璃卡片（头像 + 信息 + 时钟） ======== -->
    <section class="profile reveal" id="profileSection" aria-label="个人简介">
      <div class="profile-avatar" id="profileAvatar" aria-hidden="true">D</div>
      <div class="profile-info">
        <h1 class="profile-name" id="profileName">我是谁</h1>
        <p class="profile-role" id="profileRole">爱因斯坦万岁</p>
        <div class="profile-links" id="profileLinks">
          <a class="profile-link" href="https://github.com/" target="_blank" rel="noopener">GitHub</a>
          <a class="profile-link" href="https://orcid.org/" target="_blank" rel="noopener">ORCID</a>
          <a class="profile-link" href="mailto:" rel="noopener">邮箱</a>
        </div>
      </div>
      <div class="clock" id="clock">
        <span class="clock-time" id="clockTime">--:--:--</span>
        <span class="clock-date" id="clockDate"></span>
        <span class="clock-articles">已更新文章 <b id="articleCount">0</b> 篇</span>
      </div>
    </section>

    <!-- ======== 文章列表 ======== -->
    <section class="section articles" id="articles" aria-label="文章列表">
      <div class="section-head reveal">
        <h2 class="section-title">文章</h2>
      </div>
      <div class="article-grid" id="articleGrid"></div>
    </section>

    <!-- ======== 文章详情（点击卡片进入，隐藏） ======== -->
    <section class="article-view" id="articleView" hidden aria-label="文章详情">
      <div class="article-view-inner">
        <a class="back-link" href="#/">← 返回文章列表</a>
        <header class="article-header">
          <span class="article-cat" id="avCat"></span>
          <span class="article-date" id="avDate"></span>
        </header>
        <h1 class="article-title-big" id="avTitle"></h1>
        <div class="article-content" id="avBody"></div>
        <nav class="article-pager" id="articlePager" aria-label="文章导航"></nav>
      </div>
    </section>

  </main>

  <button class="back-top" id="backTop" type="button" aria-label="回到顶部">↑</button>

  <script src="js/config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
